<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaofeng Liang</title>
<meta name="description" content="Shaofeng Liang, PhD student at HKUST (Guangzhou). Human-robot isomorphic guide-dog robots and aerial visual perception.">
<link rel="icon" type="image/png" sizes="32x32" href="photo/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="photo/favicon-64.png">
<link rel="icon" type="image/png" sizes="512x512" href="photo/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="photo/apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --paper:#ffffff; --cloud:#f5f5f7; --cloud-2:#ebebef; --ink:#1d1d1f; --graphite:#6e6e73; --hair:rgba(0,0,0,.09);
  --accent:#0056d6;
  --gutter:clamp(20px,4vw,48px); --maxw:1200px;
  --r-card:36px;
  --sec:clamp(22px,2vw,34px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- buttons: pills everywhere ---- */
.btn{display:inline-flex;align-items:center;gap:.5em;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;letter-spacing:-.005em;white-space:nowrap;transition:transform .16s var(--ease),background-color .2s var(--ease),color .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn--ink{background:var(--ink);color:#fff}
.btn--ink:hover{background:#000}
.btn--ghost{background:var(--cloud);color:var(--ink)}
.btn--ghost:hover{background:var(--cloud-2)}
.btn--paper{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.04)}
.btn--paper:hover{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.05)}
.btn--sm{height:36px;padding:0 14px;font-size:14px}
.btn--xs{height:30px;padding:0 12px;font-size:13px;gap:.4em}
.round{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--cloud);color:var(--ink);font-size:18px;transition:background-color .2s var(--ease),transform .16s var(--ease)}
.round:hover{background:var(--cloud-2)}
.round:active{transform:scale(.95)}
.round:disabled{opacity:.35;cursor:default}

/* ---- nav ---- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
.nav__in{display:flex;align-items:center;justify-content:space-between;height:56px;gap:24px}
.nav__brand{font-weight:600;font-size:15px;letter-spacing:-.01em}
.nav__links{display:flex;align-items:center;gap:28px;font-size:14px;color:var(--graphite)}
.nav__links a{transition:color .2s var(--ease)}
.nav__links a:hover{color:var(--ink)}
.nav__cta{margin-left:8px}
.like{position:relative;gap:.45em}
.like__n{min-width:1.4em;padding:0 .5em;margin-right:-.4em;border-radius:999px;background:rgba(255,255,255,.18);font-variant-numeric:tabular-nums;font-size:13px;line-height:1.6}
.like.is-liked .like__heart{fill:#ff5a3c;stroke:#ff5a3c}
.like.pop .like__heart{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.wish{position:fixed;z-index:60;pointer-events:none;padding:6px 12px;border-radius:999px;background:#fff;color:var(--ink);font-weight:600;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.05);white-space:nowrap;animation:wish 1.5s var(--ease) forwards;transform-origin:center bottom}
.wish::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff5a3c;margin:0 8px 1px 0}
@keyframes wish{0%{opacity:0;transform:translate(-50%,6px) scale(.85)}18%{opacity:1;transform:translate(-50%,-10px) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
@media (prefers-reduced-motion:reduce){.wish{animation-duration:.9s}.like.pop .like__heart{animation:none}}

/* ---- hero: portrait left, words right ---- */
.hero{padding-block:clamp(24px,2.6vw,36px) clamp(24px,2.6vw,36px)}
.hero__grid{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(32px,4.5vw,80px)}
.portrait{margin:0;width:clamp(200px,18vw,300px);aspect-ratio:4/5;border-radius:var(--r-card);overflow:hidden;background:var(--cloud)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero h1{margin:0 0 .22em;font-size:clamp(40px,4.6vw,80px);line-height:1.02;font-weight:600;letter-spacing:-.03em;text-wrap:balance}
.hero__lede{margin:0;max-width:58ch;font-size:clamp(17px,1.2vw,20px);line-height:1.4;color:var(--graphite);letter-spacing:-.01em;text-align:justify;text-justify:inter-word;hyphens:none;-webkit-hyphens:none;overflow-wrap:normal;word-break:normal;text-wrap:pretty}
.hero__lede b{color:var(--ink);font-weight:600}
.hero__lede .para{display:block}
.hero__lede .para+.para{margin-top:.5em}
.inl{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:rgba(0,0,0,.18);text-underline-offset:.16em;text-decoration-thickness:1px;white-space:nowrap;transition:color .2s var(--ease),text-decoration-color .2s var(--ease)}
.inl:hover{color:var(--accent);text-decoration-color:currentColor}
.inl__logo{display:inline-block;height:1.05em;width:auto;vertical-align:-.17em;margin-right:.28em}
.hero__actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(20px,2vw,28px)}
.reveal{animation:rise .9s var(--ease) both}
.reveal.d1{animation-delay:.08s}.reveal.d2{animation-delay:.16s}.reveal.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---- section heads: the blue label is the section name, the black line is its subtitle ---- */
.band{padding-block:var(--sec);overflow-x:clip}
.band--cloud{background:var(--cloud)}
.band--stone{background:#f6f4ef}
.band--mint{background:#edf6f3}
.sec__head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(14px,1.4vw,18px)}
.kicker{margin:0 0 4px;font-size:clamp(22px,2vw,30px);font-weight:700;color:var(--accent);letter-spacing:-.02em;line-height:1.1}
.h2{margin:0;font-size:clamp(20px,1.6vw,26px);line-height:1.25;font-weight:600;letter-spacing:-.015em;max-width:34ch;text-wrap:balance}
.lede{margin:6px 0 0;max-width:62ch;font-size:clamp(16px,1.05vw,18px);color:var(--graphite);text-wrap:pretty}
.sec__tools{display:flex;gap:10px;flex:none}

/* ---- news ---- */
.news{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px clamp(24px,3vw,48px);margin:0}
.news dd b{color:var(--ink);font-weight:600}
.news dt{color:var(--graphite);font-variant-numeric:tabular-nums;white-space:nowrap}
.news dd{margin:0}

/* ---- research: one main topic ---- */
.card{background:var(--cloud);border-radius:28px;padding:clamp(22px,2.4vw,36px);transition:background-color .25s var(--ease)}
.card:hover{background:var(--cloud-2)}
.card__cat{font-size:15px;color:var(--graphite);margin:0}
.card__title{margin:8px 0 0;font-size:clamp(22px,1.7vw,29px);line-height:1.1;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.card__desc{margin:12px 0 0;color:var(--graphite);max-width:44ch;text-wrap:pretty}
.card__media{transition:transform .5s var(--ease)}
.card__media img{width:100%;mix-blend-mode:multiply}
.card:hover .card__media{transform:translateY(-6px)}
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,72px);align-items:center}
.main .card__title{font-size:clamp(26px,2.2vw,36px)}
.main .card__desc{max-width:48ch;font-size:17px}
/* tinted card: background matches the figure's own background, edges feathered, no multiply, no hover shift */
.card--tinted,.card--tinted:hover{background:var(--tint)}
.card--tinted .card__media img{mix-blend-mode:normal;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}

/* ---- publications ---- */
.pubs{border-top:1px solid var(--hair)}
.pub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(16px,2vw,32px);align-items:center;padding:clamp(12px,1.3vw,18px) 0;border-bottom:1px solid var(--hair)}
/* thumbnail: fixed frame the height of the three text lines; the figure is cropped from the top to fill it */
.pub__thumb{width:clamp(120px,11vw,148px);height:clamp(76px,6.4vw,90px);border-radius:10px;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.pub__thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transition:transform .5s var(--ease)}
.pub__thumb:hover img{transform:scale(1.04)}
.pub__title{margin:0;font-size:clamp(16px,1.15vw,18px);line-height:1.3;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.pub__by{margin:4px 0 0;font-size:14px;color:var(--graphite)}
.pub__by b{color:var(--ink);font-weight:600}
.pub__venue{margin:3px 0 0;font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.pub__links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.more{margin-bottom:2px}

/* ---- selected figures: drifting track + an offer ---- */
.reel__track{display:flex;gap:clamp(20px,2vw,32px);overflow-x:auto;overscroll-behavior-x:contain;scroll-behavior:auto;
  padding-bottom:6px;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 72px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 72px),transparent)}
.reel__track::-webkit-scrollbar{display:none}
.reel__item{flex:none;text-align:left;display:grid;grid-template-columns:max-content;gap:10px;align-content:start}
.reel__item .cap{width:0;min-width:100%;max-width:none}
.reel__item img{height:clamp(150px,15vw,220px);width:auto;border-radius:6px;transition:transform .5s var(--ease)}
.reel__item:hover img{transform:translateY(-4px)}
.cap{font-size:13px;line-height:1.4;color:var(--graphite);max-width:38ch}
.cap b{color:var(--ink);font-weight:600}
.cap small{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-top:4px;letter-spacing:-.005em}
.offer{margin-top:clamp(16px,1.8vw,24px);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:clamp(24px,3vw,48px)}
.offer .card__desc{max-width:60ch}

/* ---- collaborators ---- */
.people{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,24px) clamp(20px,2vw,36px);border-top:1px solid var(--hair);padding-top:clamp(14px,1.4vw,20px)}
.person{display:grid;gap:2px}
.person__name{font-weight:600;font-size:17px;letter-spacing:-.01em}
.person__name a{transition:color .2s var(--ease)}
.person__name a:hover{color:var(--accent)}
.person__aff{font-size:15px;color:var(--graphite)}

/* ---- footer: a slogan instead of a wordmark ---- */
.foot{background:var(--cloud);padding:clamp(28px,2.6vw,40px) 0 20px}
.slogan{margin:0;font-size:clamp(30px,3.8vw,56px);line-height:1.08;font-weight:600;letter-spacing:-.03em;max-width:18ch;text-wrap:balance}
.slogan-zh{margin:14px 0 0;font-size:clamp(15px,1.1vw,17px);color:var(--graphite);letter-spacing:.02em}
.foot__fine{margin-top:clamp(18px,2vw,28px);font-size:13px;color:var(--graphite);display:flex;flex-wrap:wrap;gap:8px 24px}

/* ---- request form ---- */
.ask{border:0;padding:0;margin:auto;width:min(560px,92vw);border-radius:28px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.18)}
.ask::backdrop{background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.ask form{padding:clamp(24px,3vw,36px);position:relative}
.ask__close{position:absolute;top:16px;right:16px;width:36px;height:36px;font-size:15px}
.ask__cat{margin:0;font-size:14px;color:var(--graphite)}
.ask__title{margin:6px 0 18px;font-size:clamp(22px,2vw,26px);line-height:1.15;font-weight:600;letter-spacing:-.02em;padding-right:44px}
.ask__f{display:grid;gap:6px;margin-bottom:14px}
.ask__f span{font-size:13px;font-weight:600;color:var(--graphite)}
.ask__f input,.ask__f textarea{font:inherit;font-size:16px;color:var(--ink);width:100%;border:0;background:var(--cloud);border-radius:14px;padding:12px 14px;resize:vertical}
.ask__f input:focus,.ask__f textarea:focus{outline:0;box-shadow:0 0 0 2px var(--accent);background:#fff}
.ask__err{margin:0 0 10px;font-size:14px;color:#c0392b}
.ask__actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.ask__note{font-size:13px;color:var(--graphite)}
.ask__done{margin:4px 0 18px;font-size:17px;line-height:1.5}
.ask__done b{font-weight:600}

/* ---- lightbox ---- */
.lb{border:0;padding:0;margin:auto;background:transparent;max-width:min(1480px,94vw);width:auto;overflow:visible}
.lb::backdrop{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%)}
.lb__in{display:grid;gap:18px;justify-items:center}
.lb__img{max-height:72vh;max-width:min(1480px,94vw);width:auto;border-radius:8px}
.lb__cap{max-width:70ch;text-align:center;font-size:16px;color:var(--graphite);text-wrap:pretty}
.lb__cap b{color:var(--ink);font-weight:600}
.lb__meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font-size:14px;color:var(--graphite)}
.lb__nav{position:fixed;top:50%;transform:translateY(-50%);width:52px;height:52px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.1)}
.lb__nav:hover{background:#fff}
.lb__prev{left:max(12px,2vw)}.lb__next{right:max(12px,2vw)}
.lb__close{position:fixed;top:max(12px,2vw);right:max(12px,2vw);background:var(--ink);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.lb__close:hover{background:#000}

@media (max-width:1100px){ .people{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:980px){
  .hero__grid{grid-template-columns:1fr}
  .portrait{width:min(100%,360px)}
  .main{grid-template-columns:1fr}
  .pub{grid-template-columns:1fr;align-items:start}
  .pub__links{justify-content:flex-start}
  .offer{grid-template-columns:1fr}
  .nav__links a:not(.btn){display:none}
}
@media (max-width:640px){
  .people{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec__head{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{animation:none}
  *{transition:none !important}
}
</style>
</head>

</svg>

<header class="nav">
  <div class="wrap nav__in">
    <a class="nav__brand" href="#top" id="navBrand"></a>
    <nav class="nav__links" aria-label="Sections">
      <a href="#news" id="navNews"></a>
      <a href="#research" id="navResearch"></a>
      <a href="#publications" id="navPapers"></a>
      <a href="#figures" id="navFigures"></a>
      <a href="#collaborators" id="navPeople"></a>
      <button class="btn btn--ink btn--sm nav__cta like" id="likeBtn" type="button" aria-label="Like this page"><svg class="ic like__heart"><use href="#i-heart"/></svg><span id="likeLabel">Like</span><span class="like__n" id="likeCount">–</span></button>
    </nav>
  </div>
</header>

<main id="top">
  <section class="band hero"><div class="wrap hero__grid">
    <figure class="portrait reveal"><img id="portrait" src="" alt=""></figure>
    <div>
      <h1 class="reveal d1" id="heroName"></h1>
      <p class="hero__lede reveal d2" id="heroLede"></p>
      <div class="hero__actions reveal d3" id="heroLinks"></div>
    </div>
  </div></section>

  <section class="band band--cloud" id="news"><div class="wrap">
    <div class="sec__head"><div><p class="kicker" id="newsKicker"></p><h2 class="h2" id="newsHeading"></h2></div><div class="sec__tools" id="newsTools"></div></div>
    <dl class="news" id="newsList"></dl>
  </div></section>

  <section class="band" id="research"><div class="wrap">
    <div class="sec__head"><div><p class="kicker" id="resKicker"></p><h2 class="h2" id="resHeading"></h2><p class="lede" id="resLede"></p></div></div>
    <article class="card main">
      <div><p class="card__cat" id="resCat"></p><h3 class="card__title" id="resTitle"></h3><p class="card__desc" id="resDesc"></p></div>
      <div class="card__media"><img id="resFig" src="" alt=""></div>
    </article>
  </div></section>

  <section class="band" id="publications"><div class="wrap">
    <div class="sec__head"><div><p class="kicker" id="pubKicker"></p><h2 class="h2" id="pubHeading"></h2></div><div class="sec__tools" id="pubTools"></div></div>
    <div class="pubs" id="pubs"></div>
  </div></section>

  <section class="band" id="figures"><div class="wrap">
    <div class="sec__head">
      <div><p class="kicker" id="figKicker"></p><h2 class="h2" id="figHeading"></h2><p class="lede" id="figLede"></p></div>
      <div class="sec__tools">
        <button class="round" id="reelPrev" aria-label="Scroll figures left"><svg class="ic"><use href="#i-left"/></svg></button>
        <button class="round" id="reelNext" aria-label="Scroll figures right"><svg class="ic"><use href="#i-right"/></svg></button>
      </div>
    </div>
    <div class="reel__track" id="reel" tabindex="0" aria-label="Selected figures, scrolls horizontally"></div>
    <div class="card offer" id="offer">
      <div><p class="card__cat" id="offerCat"></p><h3 class="card__title" id="offerTitle"></h3><p class="card__desc" id="offerDesc"></p></div>
      <button class="btn btn--ink" id="offerBtn" type="button"><svg class="ic"><use href="#i-pen"/></svg><span></span></button>
    </div>
  </div></section>

  <section class="band band--mint" id="collaborators"><div class="wrap">
    <div class="sec__head"><div><p class="kicker" id="colKicker"></p><h2 class="h2" id="colHeading"></h2></div></div>
    <div class="people" id="people"></div>
  </div></section>
</main>

<footer class="foot"><div class="wrap">
  <p class="slogan" id="slogan"></p>
  <p class="slogan-zh" id="sloganZh"></p>
  <div class="foot__fine">
    <span><svg class="ic" style="vertical-align:-2px"><use href="#i-pin"/></svg> <span id="footLoc"></span></span>
    <span id="footNote"></span>
    <span id="footCopy"></span>
  </div>
</div></footer>

<dialog class="ask" id="ask" aria-labelledby="askTitle">
  <form id="askForm" method="dialog" novalidate>
    <button class="round ask__close" type="button" id="askClose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    <p class="ask__cat">Figures for your paper</p>
    <h3 class="ask__title" id="askTitle">Tell me about the figure you need.</h3>
    <div id="askFields">
      <label class="ask__f"><span>Topic</span><input name="topic" type="text" placeholder="e.g. Pipeline figure for a tracking paper" required></label>
      <label class="ask__f"><span>What the paper is about</span><textarea name="research" rows="3" placeholder="One or two sentences on the method and the venue you're targeting" required></textarea></label>
      <label class="ask__f"><span>What you need</span><textarea name="need" rows="3" placeholder="Which figures, in what style, and by when" required></textarea></label>
      <label class="ask__f"><span>Your email</span><input name="email" type="email" placeholder="name@university.edu" required></label>
      <p class="ask__err" id="askErr" hidden>Please fill in every field with a valid email.</p>
      <div class="ask__actions"><button class="btn btn--ink" type="submit" id="askSend"><svg class="ic"><use href="#i-mail"/></svg><span>Send</span></button><span class="ask__note" id="askNote"></span></div>
    </div>
    <div id="askDone" hidden><p class="ask__done"></p><button class="btn btn--ghost" type="button" id="askOk">Close</button></div>
  </form>
</dialog>

<dialog class="lb" id="lb" aria-label="Figure viewer">
  <div class="lb__in">
    <img class="lb__img" id="lbImg" alt="">
    <p class="lb__cap" id="lbCap"></p>
    <div class="lb__meta" id="lbMeta"></div>
  </div>
  <button class="round lb__nav lb__prev" id="lbPrev" aria-label="Previous figure"><svg class="ic"><use href="#i-left"/></svg></button>
  <button class="round lb__nav lb__next" id="lbNext" aria-label="Next figure"><svg class="ic"><use href="#i-right"/></svg></button>
  <button class="round lb__close" id="lbClose" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
</dialog>

<script src="config.js"></script>
<script>
/* ---------- pick the content: config.js, or a draft from admin.html when opened with ?preview ---------- */
let SITE = window.SITE;
try { if (location.search.includes("preview")) { const d = localStorage.getItem("site-preview"); if (d) SITE = JSON.parse(d); } } catch (_) {}

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const inl = (o, logo) => `<a class="inl" href="${esc(o.url || "#")}" target="_blank" rel="noopener">${logo && o.logo ? `<img class="inl__logo" src="${esc(o.logo)}" alt="" onerror="this.remove()">` : ""}${esc(o.name)}</a>`;
const rich = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")                                          // **bold**
  .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a class="inl" href="$2" target="_blank" rel="noopener">$1</a>')  // [text](url)
  .replace(/\{school\}/g, () => SITE.school ? inl(SITE.school, true) : "")
  .replace(/\{advisor\}/g, () => SITE.advisor ? inl(SITE.advisor) : "")
  .replace(/\r/g, "");
// keep a lone "I" glued to the word after it, so it never dangles at the end of a justified line
const glueI = s => s.replace(/(^|[\s>(])I (?=\S)/g, "$1I\u00A0");
const paras = s => glueI(rich(s)).trim().split(/\n{2,}/).map(p => `<span class="para">${p.replace(/\n/g, "<br>")}</span>`).join("");
const icon = id => `<svg class="ic" aria-hidden="true"><use href="#${id}"/></svg>`;
const iconFor = label => { const l = label.toLowerCase();
  if (l.includes("scholar")) return "i-cap"; if (l.includes("github")) return "i-github"; if (l.includes("dblp")) return "i-library";
  if (l.includes("orcid")) return "i-id"; if (l.includes("pdf") || l.includes("paper")) return "i-file"; if (l.includes("code")) return "i-code";
  if (l.includes("data")) return "i-db"; if (l.includes("mail")) return "i-mail"; return "i-ext"; };
const text = (id, v) => { $("#" + id).textContent = v ?? ""; };
const shown = g => { const n = Number(g.show); return Number.isFinite(n) && n >= 0 ? g.items.slice(0, n) : g.items; };
function moreButton(group, slot, label, render){
  if (group.items.length <= shown(group).length || group.showAll === false) return;
  const more = group.showAllLabel || label, less = group.showLessLabel || "Show less"; let open = false;
  const b = el("button", "btn btn--ghost btn--sm more", esc(more)); b.type = "button";
  b.addEventListener("click", () => { open = !open; render(open ? group.items : shown(group)); b.textContent = open ? less : more; });
  slot.appendChild(b);
}
const mailto = subject => `mailto:${SITE.email}${subject ? "?subject=" + encodeURIComponent(subject) : ""}`;

/* ---------- hero + nav ---------- */
document.title = SITE.name;
text("navBrand", SITE.name); text("heroName", SITE.name);
$("#heroLede").innerHTML = paras(SITE.lede);
$("#portrait").src = SITE.portrait; $("#portrait").alt = SITE.name;
$("#heroLinks").appendChild(el("a", "btn btn--ink", icon("i-mail") + "Email")).href = mailto();
SITE.links.forEach(l => { $("#heroLinks").appendChild(el("a", "btn btn--ghost", icon(iconFor(l.label)) + esc(l.label))).href = l.url; });
text("navNews", SITE.news.kicker); text("navResearch", SITE.research.kicker); text("navPapers", SITE.papers.kicker);
text("navFigures", "Figures"); text("navPeople", SITE.collaborators.kicker);

/* ---------- like button: a shared counter (abacus.jasoncameron.dev) with a local fallback ---------- */
const L = SITE.likes || {}; const likeBtn = $("#likeBtn"), likeN = $("#likeCount");
$("#likeLabel").textContent = L.label || "Like";
const LK = "likes:" + (L.namespace || "site"); const localN = () => Number(localStorage.getItem(LK) || 0);
const api = kind => `https://abacus.jasoncameron.dev/${kind}/${encodeURIComponent(L.namespace || "site")}/${encodeURIComponent(L.key || "likes")}`;
const fmt = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
let wishIdx = Math.floor(Math.random() * ((L.wishes || []).length || 1));
async function countGet(){ try { const r = await fetch(api("get"), { cache: "no-store" }); const j = await r.json(); if (typeof j.value === "number") { likeN.textContent = fmt(j.value); return; } } catch (_) {} likeN.textContent = fmt(localN()); }
async function countHit(){ try { const r = await fetch(api("hit"), { cache: "no-store" }); const j = await r.json(); if (typeof j.value === "number") { likeN.textContent = fmt(j.value); return; } } catch (_) {} localStorage.setItem(LK, String(localN() + 1)); likeN.textContent = fmt(localN()); }
function wish(){
  const list = L.wishes && L.wishes.length ? L.wishes : ["Accept!"]; const w = el("span", "wish", esc(list[wishIdx++ % list.length]));
  const r = likeBtn.getBoundingClientRect(); w.style.left = (r.left + r.width / 2 + (Math.random() * 24 - 12)) + "px"; w.style.top = (r.top - 6) + "px";
  document.body.appendChild(w); w.addEventListener("animationend", () => w.remove());
}
if (likeBtn) {
  countGet();
  likeBtn.addEventListener("click", () => {
    likeBtn.classList.add("is-liked"); likeBtn.classList.remove("pop"); void likeBtn.offsetWidth; likeBtn.classList.add("pop");
    likeN.textContent = fmt((parseInt(likeN.textContent) || localN()) + 1);   // optimistic
    wish(); countHit();
  });
}

/* ---------- news ---------- */
text("newsKicker", SITE.news.kicker); text("newsHeading", SITE.news.heading);
function renderNews(items){ $("#newsList").innerHTML = ""; items.forEach(n => { $("#newsList").appendChild(el("dt", null, esc(n.date))); $("#newsList").appendChild(el("dd", null, rich(n.text))); }); }
renderNews(shown(SITE.news)); moreButton(SITE.news, $("#newsTools"), "Show all news", renderNews);

/* ---------- research ---------- */
const R = SITE.research;
text("resKicker", R.kicker); text("resHeading", R.heading); text("resLede", R.lede);
text("resCat", R.category); text("resTitle", R.title); text("resDesc", R.description);
$("#resFig").src = R.figure; $("#resFig").alt = R.title;
// card colour follows the figure: explicit hex in config wins; otherwise sample the figure's own edge colour once it loads
(function tintCard(){
  const img = $("#resFig"), card = img.closest(".card");
  const apply = hex => { card.classList.add("card--tinted"); card.style.setProperty("--tint", hex); };
  if (R.tint && /^#?[0-9a-f]{6}$/i.test(R.tint.trim())) return apply(R.tint.trim().startsWith("#") ? R.tint.trim() : "#" + R.tint.trim());
  if (R.tint === "none") return;
  const sample = () => { try {
    const c = document.createElement("canvas"), W = c.width = img.naturalWidth, H = c.height = img.naturalHeight; if (!W || !H) return;
    const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, W, H).data, m = Math.max(4, Math.round(Math.min(W, H) * 0.01)); let r = 0, g = 0, b = 0, n = 0;
    for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) { if (yy < m || xx < m || yy >= H - m) { const k = (yy * W + xx) * 4; r += d[k]; g += d[k + 1]; b += d[k + 2]; n++; } }
    apply("#" + [r, g, b].map(v => Math.round(v / n).toString(16).padStart(2, "0")).join(""));
  } catch (_) {} };   // canvas is read-only for file:// pages in some browsers; then the card just stays grey
  if (img.complete && img.naturalWidth) sample(); else img.addEventListener("load", sample, { once: true });
})();

/* ---------- figures (data for reel + lightbox) ---------- */
const FIGS = shown(SITE.figures);
const capHTML = f => (f.label && f.label.trim() ? `<b>${esc(f.label.trim().replace(/\.$/, ""))}.</b> ` : "") + esc(f.caption);

/* ---------- publications ---------- */
text("pubKicker", SITE.papers.kicker); text("pubHeading", SITE.papers.heading);
function renderPapers(items){ $("#pubs").innerHTML = ""; items.forEach(p => {
  const a = el("article", "pub");
  // bold every occurrence of my name, whatever the separator (comma or semicolon) and even with a trailing * for equal contribution
  const nameRe = new RegExp(SITE.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
  const by = esc(p.authors).replace(nameRe, m => `<b>${m}</b>`);
  a.innerHTML = `<button class="pub__thumb" type="button" aria-label="Open a figure from this paper"><img src="${esc(p.thumb)}" alt=""></button>
    <div><h3 class="pub__title">${esc(p.title)}</h3><p class="pub__by">${by}</p><p class="pub__venue">${esc(p.venue)}</p></div>
    <div class="pub__links">${(p.links || []).map(l => `<a class="btn btn--ghost btn--xs" href="${esc(l.url)}">${icon(iconFor(l.label))}${esc(l.label)}</a>`).join("")}</div>`;
  a.querySelector("button").addEventListener("click", () => {
    const i = FIGS.findIndex(f => f.src === p.thumb);
    if (i >= 0) openLB(i); else { lbSolo = { src: p.thumb, label: "Figure", caption: p.title, source: p.venue, tool: "", url: (p.links[0] || {}).url || "#" }; openLB(-1); }
  });
  $("#pubs").appendChild(a);
}); }
renderPapers(shown(SITE.papers)); moreButton(SITE.papers, $("#pubTools"), "Show all papers", renderPapers);

/* ---------- selected figures: reel ---------- */
text("figKicker", SITE.figures.kicker); text("figHeading", SITE.figures.heading); text("figLede", SITE.figures.lede);
const O = SITE.figures.offer;
text("offerCat", O.category); text("offerTitle", O.title); text("offerDesc", O.description);
$("#offerBtn span").textContent = O.button; $("#offerBtn").addEventListener("click", () => { askForm.reset(); $("#askDone").hidden = true; $("#askFields").hidden = false; ask.showModal(); });

const reel = $("#reel");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function reelItem(f, i){
  const b = el("button", "reel__item"); b.type = "button";
  b.innerHTML = `<img src="${esc(f.src)}" alt="" draggable="false"><span class="cap">${capHTML(f)}<small>${esc(f.source)}</small></span>`;
  b.setAttribute("aria-label", `Open ${f.label} at full size`);
  b.addEventListener("click", () => openLB(i));
  b.querySelector("img").addEventListener("load", measure);
  return b;
}
FIGS.forEach((f, i) => reel.appendChild(reelItem(f, i)));
FIGS.forEach((f, i) => { const c = reelItem(f, i); c.setAttribute("aria-hidden", "true"); c.tabIndex = -1; reel.appendChild(c); });  // clones for a seamless loop

const SPEED = 22; // px per second: a slow drift, not a slideshow
let hover = false, focus = false, inView = true, manualUntil = 0, last = null, setWidth = 0;
function measure(){ const kids = reel.children; const n = FIGS.length; if (kids.length < n + 1) return; setWidth = kids[n].offsetLeft - kids[0].offsetLeft; }
addEventListener("load", measure); addEventListener("resize", measure);
function drifting(){ return !reduced && !hover && !focus && inView && !document.hidden && performance.now() > manualUntil && setWidth > 0; }
function tick(t){
  if (last == null) last = t; const dt = Math.min((t - last) / 1000, .1); last = t;
  if (drifting()) { reel.scrollLeft += SPEED * dt; if (reel.scrollLeft >= setWidth) reel.scrollLeft -= setWidth; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
reel.addEventListener("mouseenter", () => hover = true); reel.addEventListener("mouseleave", () => hover = false);
reel.addEventListener("focusin", e => { try { focus = e.target.matches(":focus-visible"); } catch (_) { focus = false; } });
reel.addEventListener("focusout", () => focus = false);
new IntersectionObserver(es => inView = es[0].isIntersecting, { threshold: .05 }).observe(reel);
reel.addEventListener("pointerdown", () => manualUntil = performance.now() + 3500);
reel.addEventListener("wheel", () => manualUntil = performance.now() + 3500, { passive: true });
function nudge(dir){
  manualUntil = performance.now() + 3500;
  const step = Math.max(320, reel.clientWidth * .6);
  let target = reel.scrollLeft + dir * step;
  if (target < 0) { reel.scrollLeft += setWidth; target += setWidth; }
  reel.scrollTo({ left: target, behavior: reduced ? "auto" : "smooth" });
}
$("#reelPrev").addEventListener("click", () => nudge(-1));
$("#reelNext").addEventListener("click", () => nudge(1));

/* ---------- collaborators ---------- */
text("colKicker", SITE.collaborators.kicker); text("colHeading", SITE.collaborators.heading);
shown(SITE.collaborators).forEach(c => {
  const has = c.url && c.url.trim() && c.url.trim() !== "#";
  const name = has ? `<a href="${esc(c.url.trim())}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name);
  $("#people").appendChild(el("div", "person", `<span class="person__name">${name}</span><span class="person__aff">${esc(c.affiliation)}</span>`));
});

/* ---------- footer ---------- */
const F = SITE.footer;
text("slogan", F.slogan); text("sloganZh", F.sloganZh); text("footLoc", F.location); text("footNote", F.note); text("footCopy", F.copyright);

/* ---------- request form: POST to a form endpoint if one is configured, otherwise open the visitor's mail app ---------- */
const ask = $("#ask"), askForm = $("#askForm"), ENDPOINT = (O.endpoint || "").trim();
$("#askNote").textContent = ENDPOINT ? "" : "Opens your mail app with everything filled in.";
$("#askClose").addEventListener("click", () => ask.close()); $("#askOk").addEventListener("click", () => ask.close());
ask.addEventListener("click", e => { if (e.target === ask) ask.close(); });
askForm.addEventListener("submit", async e => {
  e.preventDefault();
  const v = Object.fromEntries(new FormData(askForm)); const ok = ["topic", "research", "need", "email"].every(k => (v[k] || "").trim()) && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email);
  $("#askErr").hidden = ok; if (!ok) return;
  const subject = `Figure request: ${v.topic.trim()}`;
  const body = `Topic: ${v.topic.trim()}\n\nAbout the paper:\n${v.research.trim()}\n\nWhat is needed:\n${v.need.trim()}\n\nReply to: ${v.email.trim()}`;
  const done = msg => { $("#askFields").hidden = true; $("#askDone").hidden = false; $("#askDone .ask__done").innerHTML = msg; };
  if (ENDPOINT) {
    const btn = $("#askSend"); btn.disabled = true; btn.querySelector("span").textContent = "Sending";
    try {
      const r = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ topic: v.topic.trim(), research: v.research.trim(), need: v.need.trim(), email: v.email.trim(), _subject: subject, _replyto: v.email.trim() }) });
      if (!r.ok) throw new Error(String(r.status));
      done(`Sent. I'll reply to <b>${esc(v.email.trim())}</b>, usually within a couple of days.`);
    } catch (_) {
      location.href = mailto(subject) + "&body=" + encodeURIComponent(body);
      done(`The form service didn't answer, so I opened your mail app with everything filled in. Or write to <b>${esc(SITE.email)}</b>.`);
    } finally { btn.disabled = false; btn.querySelector("span").textContent = "Send"; }
  } else {
    location.href = mailto(subject) + "&body=" + encodeURIComponent(body);
    done(`Your mail app should open with the request filled in. If it didn't, write to <b>${esc(SITE.email)}</b>.`);
  }
});

/* ---------- lightbox ---------- */
const lb = $("#lb"), lbImg = $("#lbImg"), lbCap = $("#lbCap"), lbMeta = $("#lbMeta");
let lbIdx = 0, lbSolo = null;
function render(){
  const solo = lbIdx < 0, f = solo ? lbSolo : FIGS[lbIdx];
  lbImg.src = f.src; lbImg.alt = f.label;
  lbCap.innerHTML = capHTML(f);
  lbMeta.innerHTML = `<span>${esc(f.source)}</span>` + (f.url && f.url !== "#" ? `<a class="btn btn--ghost btn--xs" href="${esc(f.url)}">${icon("i-file")}Open paper</a>` : "")
    + (f.tool ? `<span>Drawn with ${esc(f.tool)}</span>` : "") + (solo ? "" : `<span>${lbIdx + 1} of ${FIGS.length}</span>`);
  $("#lbPrev").disabled = solo || FIGS.length < 2; $("#lbNext").disabled = solo || FIGS.length < 2;
}
function openLB(i){ lbIdx = i; render(); if (!lb.open) lb.showModal(); }
function stepLB(d){ if (lbIdx < 0 || FIGS.length < 2) return; lbIdx = (lbIdx + d + FIGS.length) % FIGS.length; render(); }
$("#lbPrev").addEventListener("click", () => stepLB(-1));
$("#lbNext").addEventListener("click", () => stepLB(1));
$("#lbClose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("keydown", e => { if (e.key === "ArrowRight") stepLB(1); if (e.key === "ArrowLeft") stepLB(-1); });
</script>
</body>
</html>
